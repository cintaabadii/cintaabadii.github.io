<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cinta Abadi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    body {
      background: linear-gradient(to right, #ffe0ec, #fff6f9);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header.hero {
      width: 100%;
      max-width: 700px;
      overflow: hidden;
      border: none;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4);
      box-shadow: 0 6px 20px rgba(231, 84, 128, 0.4);
      text-align: center;
    }

    .marquee {
      display: inline-block;
      white-space: nowrap;
      animation: moveRight 12s linear infinite;
      font-size: 2rem;
      font-weight: 700;
      color: white;
    }

    @keyframes moveRight {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    section.menu {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    section.menu h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #e75480;
      margin-bottom: 1.5rem;
      border-bottom: 3px solid #e75480;
      padding-bottom: 0.5rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }

    .menu-item {
      background: white;
      border-radius: 1.2rem;
      padding: 1.2rem 1rem;
      box-shadow: 0 8px 20px rgba(231, 84, 128, 0.15);
      width: 100%;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .menu-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(231, 84, 128, 0.3);
    }

    .menu-item span {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      color: #e75480;
      transition: color 0.3s ease;
    }

    .menu-item:hover span {
      color: #c63d66;
    }

    .menu-item button {
      background: linear-gradient(to right, #e75480, #ff7c9e);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 0.7rem;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
    }

    .menu-item button:hover {
      background: linear-gradient(to right, #d3466f, #f76590);
    }

    a {
      width: 100%;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      section.menu h2 {
        font-size: 1.6rem;
      }

      .menu-item span {
        font-size: 2rem;
      }

      .menu-item button {
        font-size: 0.95rem;
        padding: 0.5rem 0.9rem;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="marquee">Selamat Datang di Website Cinta Abadi</div>
  </header>

  <section class="menu">
    <h2>Pilih Menu di Bawah Ini</h2>
    <div class="menu-grid">
      <div class="menu-item">
        <span>📘</span>
        <a href="modul.html"><button>Modul Belajar</button></a>
      </div>
      <div class="menu-item">
        <span>📝</span>
        <a href="quis.html"><button>Quis</button></a>
      </div>
      <div class="menu-item">
        <span>💡</span>
        <a href="tips.html"><button>Tips</button></a>
      </div>
      <div class="menu-item">
        <span>📗</span>
        <a href="cerita-nyata.html"><button>Cerita Nyata</button></a>
      </div>
      <div class="menu-item">
        <span>📜</span>
        <a href="pantun.html"><button>Pantun</button></a>
      </div>
      <div class="menu-item">
        <span>ℹ️</span>
        <a href="about.html"><button>About</button></a>
      </div>
    </div>
  </section>
</body>
</html>
